name: comment-rule

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  comment-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target runs this file from the default branch, so a PR cannot edit its own check.
      # It also runs with the repository's token: read the PR head as git objects only, never execute it.
      - name: Checkout the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the PR head and base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done

      - name: Checkout the checker at a pinned commit
        uses: actions/checkout@v6
        with:
          repository: davekim917/bootstrap
          ref: 7cb6dae82f5a07131d9ad79a28762b294c5e9e22
          path: .comment-rule-checker
          sparse-checkout: plugins/comment-rule
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the checker
        working-directory: .comment-rule-checker/plugins/comment-rule
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: No net comment growth, no file:line or PR/issue references in comments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .comment-rule-checker/plugins/comment-rule/bin/comment-rule.mjs check --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --own-typescript
