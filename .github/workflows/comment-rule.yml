name: comment-rule

on:
  pull_request:

permissions:
  contents: read

jobs:
  comment-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the checker at a pinned commit
        uses: actions/checkout@v6
        with:
          repository: davekim917/bootstrap
          ref: 7cb6dae82f5a07131d9ad79a28762b294c5e9e22
          path: .comment-rule-checker
          sparse-checkout: plugins/comment-rule
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the checker
        working-directory: .comment-rule-checker/plugins/comment-rule
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: No net comment growth, no file:line or PR/issue references in comments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .comment-rule-checker/plugins/comment-rule/bin/comment-rule.mjs check --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --own-typescript
