name: comment-rule

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: comment-rule-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # pull_request_target runs this file from the default branch, so a PR cannot edit its own check.
      # It also runs with the repository's token: read the PR head as git objects only, never execute it.
      # Its check run lands on the head the event named; the status marks the head read below, so a rerun after a push judges the current head.
      - name: Read the PR as it is now, so a rerun never judges a stale head or base
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"HEAD_SHA=\(.head.sha)\nBASE_SHA=\(.base.sha)"' >> "$GITHUB_ENV"

      - name: Mark the PR head pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=comment-rule -f target_url="$RUN_URL" -f description="Checking comments" > /dev/null

      - name: Checkout the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch the PR head and base
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done

      - name: Checkout the checker at a pinned commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: davekim917/bootstrap
          ref: 7cb6dae82f5a07131d9ad79a28762b294c5e9e22
          path: .comment-rule-checker
          sparse-checkout: plugins/comment-rule
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the checker
        working-directory: .comment-rule-checker/plugins/comment-rule
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: No net comment growth, no file:line or PR/issue references in comments
        id: check
        run: node .comment-rule-checker/plugins/comment-rule/bin/comment-rule.mjs check --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --own-typescript

      - name: Report the verdict on the PR head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; description="No comment growth"; else state=failure; description="Comment rule failed; see the run"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=comment-rule -f target_url="$RUN_URL" -f description="$description" > /dev/null
