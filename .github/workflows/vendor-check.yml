# Vendor-check CI: guards the shared destructive-guard core against drift.
#
# What this enforces:
#   1. `node scripts/check-parity.mjs` — every drift gate the host pre-commit
#      hook runs (vendored guard copies, generated skills, workflow contracts,
#      plugin boundaries), so a commit from a clone without that hook is
#      checked too.
#   2. On a pull request, `node scripts/check-version-bump.mjs` — a change under
#      plugins/<p>/ bumps that plugin's version in every manifest and
#      marketplace entry, or installs never see it.
#   3. The guard test suite (bun test) over the source-of-truth guards.
#
# KNOWN RISK R2 — this workflow is the MECHANISM, not the enforcement. Making it
# a REQUIRED / non-bypassable status check is a GitHub branch-protection setting
# (Settings → Branches → branch protection rule → "Require status checks to
# pass before merging" → select "vendor-check"). That is a repo-admin action,
# NOT code, and cannot be configured from this file. Until an admin marks this
# check required, a PR can still be merged while it is red.
name: vendor-check

on:
  pull_request:
  push:

jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Every changed plugin bumps its version
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs --base origin/${{ github.base_ref }}

      - name: Run the version-bump gate tests
        run: node --test scripts/check-version-bump.test.mjs

      - name: Run the dev-login verifier tests
        run: node --test scripts/verify-dev-logins.test.mjs

      - name: Install workflow hook dependencies
        working-directory: plugins/workflow/hooks
        run: bun install --production

      - name: Install workflow-agents hook dependencies
        working-directory: plugins/workflow-agents/hooks
        run: bun install --production

      - name: Run guard test suite
        working-directory: plugins/workflow/hooks/guards
        run: bun test

      - name: Run Codex hook test suite
        working-directory: plugins/workflow-agents/hooks
        run: bun test

      - name: Parity and boundary drift gates (the same set the pre-commit hook runs)
        run: node scripts/check-parity.mjs

      - name: Run the analytics-verify check script tests
        run: python3 -m unittest discover -s plugins/analytics-verify/skills/analytics-verify/scripts -p 'test_*.py'

      - name: Run the slack-humanizer payload builder tests
        run: python3 -m unittest discover -s plugins/slack-humanizer/skills/slack-humanizer -p 'test_*.py'

      - name: Install the comment-rule parser
        working-directory: plugins/comment-rule
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the comment-rule tests
        run: node --test plugins/comment-rule/test/comment-rule.test.mjs

