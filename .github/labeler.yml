# Which changes need review before they merge. codex-review.sh (`scope`, `merge-check`)
# reads `risk:high` from the base branch and matches each changed file against it; a PR
# touching none of these globs merges on green CI. Keep `risk:high` in the one shape the
# gate reads (one rule, one any-glob-to-any-file list of quoted globs using only * and **)
# or every PR fails closed to review. Globs cannot exclude, so this lists every tracked
# top-level path except README.md: a new top-level path skips review until it is added here.
#
# Everything under plugins/ reaches every agent in the fleet within the hour of a merge.

risk:high:
- changed-files:
  - any-glob-to-any-file:
    - 'plugins/**'
    - 'scripts/**'
    - '.github/**'
    # Every dotfile and dot-directory: the marketplace manifests, the comment checker's config,
    # the public-boundary scan's exemptions, .gitignore, and agent config (.claude, .mcp.json)
    - '.*'
    - '.*/**'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - 'evals/**'
    - 'deprecated/**'
